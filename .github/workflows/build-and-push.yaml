name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Login towards registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ertia CLI
        run: |
          curl -fsSL https://ertia.io/install.sh | bash

      - name: Build application (branch)
        if: ${{ github.ref_type == 'branch' }}
        run: ertia app build

      - name: Build application (tag)
        if: ${{ github.ref_type == 'tag' }}
        env:
          tag: ${{ github.ref_name }}"
        run: ertia app build --tag=$tag

      - name: Deploy to test
        if: github.ref == 'refs/heads/main'
        run: ertia app deploy test
