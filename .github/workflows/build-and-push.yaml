name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Login towards registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ertia CLI
        run: |
          curl -o- https://ertia.io/install.sh | bash

      - name: Build application
        run: ertia app build

      - name: Deploy to test
        if: github.ref == 'refs/heads/main'
        run: ertia app deploy test
